name: Distribution Readiness

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: distribution-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Python Package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and verification tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install build twine

      - name: Check formatting
        run: python -m ruff format --check src tests migrations scripts

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m pyright

      - name: Test
        run: python -m pytest

      - name: Audit project dependencies
        run: python -m pip_audit --skip-editable

      - name: Build source and wheel distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Smoke install built wheel
        run: |
          python -m venv .venv-dist-smoke
          . .venv-dist-smoke/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          proxmox-mcp --version

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*

  admin-web:
    name: Build Admin WebUI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install, test, and build
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build

  docker:
    name: Build Container Image
    runs-on: ubuntu-latest
    needs: [admin-web]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: enterprise-proxmox-mcp:distribution
